version: 2
project_name: critty

builds:
  - id: critty
    main: ./cmd/critty/
    binary: critty
    ldflags:
      - -s -w -X github.com/crittylabs/critty/internal/cli.version=v{{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: codex
    main: ./cmd/codex/
    binary: codex
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# The release workflow supplies the matching CHANGELOG.md section with --release-notes.
release:
  use_existing_draft: true
  mode: replace
