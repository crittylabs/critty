merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: dependency-updates
    batch_size: 5
    batch_max_wait_time: 1 min
    checks_timeout: auto
    merge_method: fast-forward
    queue_conditions:
      - base = main
      - author ~= ^(dependabot|renovate)\[bot\]$
      - label = dependencies
      - label != dependencies:major
      - -draft
      - -conflict
      - check-success = test
      - "#approved-reviews-by >= 1"
    merge_conditions:
      - check-success = test
      - "#approved-reviews-by >= 1"

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - author ~= ^(dependabot|renovate)\[bot\]$
    - label = dependencies
    - label != dependencies:major
    - -draft
    - -conflict
    - check-success = test
    - "#approved-reviews-by >= 1"
  reporting_method: check-runs
