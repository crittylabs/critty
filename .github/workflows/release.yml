name: Release

# Runs only on tag-shaped refs whose CI succeeded, and only after verifying
# the tag still points at the tested commit, so the trigger is not exposed to
# untrusted pull request code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  goreleaser:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points at the tested commit
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$TESTED_SHA"

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          awk -v heading="## ${TAG#v}" '
            /^## / {
              selected = ($0 == heading)
              if (selected) matches++
              next
            }
            selected {
              notes = notes $0 "\n"
              if ($0 ~ /[^[:space:]#]/) content = 1
            }
            END {
              if (matches != 1 || !content) {
                print "expected one nonempty CHANGELOG.md section: " heading > "/dev/stderr"
                exit 1
              }
              printf "%s", notes
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
