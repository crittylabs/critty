name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tmux: [v3.7c, preview]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Cache poisoning is not a concern here; this job only runs tests and
      # publishes nothing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - name: Test AI reviewer permissions
        run: |
          set -euo pipefail
          python3 e2e/claude_review_gate_test.py
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/python3" -m pip install -r internal/cli/skill/critty-ai-review/scripts/codex-review-requirements.txt
          "$RUNNER_TEMP/review-venv/bin/python3" e2e/codex_review_server_test.py

      - name: Install tmux for E2E scenarios
        env:
          GH_TOKEN: ${{ github.token }}
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            *) exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          tmux_dir="$RUNNER_TEMP/tmux"
          mkdir -p "$tmux_dir"
          gh release view "$TMUX_VERSION" --repo tmux/tmux-builds --json assets > "$tmux_dir/release.json"
          asset=$(jq -er --arg suffix "-$platform-$arch.tar.gz" '
            [.assets[] | select(.name | startswith("tmux-") and endswith($suffix))]
            | if length == 1 then .[0].name else error("expected one tmux archive") end
          ' "$tmux_dir/release.json")
          digest=$(jq -er --arg name "$asset" '
            .assets[] | select(.name == $name) | .digest
            | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")
          ' "$tmux_dir/release.json")
          gh release download "$TMUX_VERSION" --repo tmux/tmux-builds --pattern "$asset" --dir "$tmux_dir"
          printf '%s  %s\n' "$digest" "$tmux_dir/$asset" | shasum -a 256 --check
          tar -xzf "$tmux_dir/$asset" -C "$tmux_dir"
          printf '%s\n' "$tmux_dir" >> "$GITHUB_PATH"
          "$tmux_dir/tmux" -V

      - name: Test CLI and TUI review scenarios
        run: python3 e2e/scenarios.py

      - name: Test doctor image diagnostics
        run: python3 e2e/doctor_images_test.py

      - name: Test demo release script
        run: sh demo/release_test.sh

  # Keep the required check stable for branch protection and Mergify.
  test:
    needs: test-platform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all platforms to pass
        env:
          RESULT: ${{ needs.test-platform.result }}
        run: test "$RESULT" = success
